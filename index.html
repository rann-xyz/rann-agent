<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RANN Agent - AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg2: #111113;
      --bg3: #1a1a1d;
      --bg4: #222225;
      --border: #2d2d30;
      --border2: #3d3d40;
      --text: #ededef;
      --text2: #a1a1a6;
      --text3: #6b6b70;
      --accent: #ff6b35;
      --accent2: #ff8255;
      --accent-glow: rgba(255, 107, 53, 0.15);
      --success: #22c55e;
      --error: #ef4444;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 12px;
      --radius-lg: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 56px;
      background: rgba(10, 10, 11, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .header-title {
      font-weight: 600;
      font-size: 15px;
    }

    .header-status {
      font-size: 12px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 16px;
    }

    .header-btn:hover {
      background: var(--bg3);
      color: var(--text);
    }

    /* Main layout */
    .main {
      flex: 1;
      display: flex;
      margin-top: 56px;
      height: calc(100vh - 56px);
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 56px;
      bottom: 0;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .sidebar-toggle {
      display: none;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--bg4);
      border-color: var(--border2);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .sidebar-section {
      margin-bottom: 16px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
    }

    .provider-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .provider-item {
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      font-family: var(--font);
    }

    .provider-item:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .provider-item.active {
      background: var(--accent-glow);
      color: var(--accent);
    }

    .provider-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .provider-item.groq .provider-icon { background: #f0130d; }
    .provider-item.deepseek .provider-icon { background: #0a9396; }
    .provider-item.anthropic .provider-icon { background: #d2a679; color: #1a1a1d; }
    .provider-item.openai .provider-icon { background: #10a37f; }
    .provider-item.gemini .provider-icon { background: #4285f4; }
    .provider-item.ollama .provider-icon { background: #904930; }
    .provider-item.xkiro .provider-icon { background: var(--accent); }
    .provider-item.custom .provider-icon { background: #9333ea; }

    .provider-info {
      flex: 1;
    }

    .provider-name {
      font-weight: 500;
      font-size: 13px;
    }

    .provider-model {
      font-size: 11px;
      color: var(--text3);
      margin-top: 1px;
    }

    .provider-free {
      font-size: 10px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .message {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      animation: msg-in 0.3s ease;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: var(--accent);
    }

    .message.user .message-avatar {
      background: var(--bg4);
    }

    .message-content {
      max-width: 85%;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      line-height: 1.7;
    }

    .message.assistant .message-content {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
    }

    .message.user .message-content {
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
    }

    .message-content pre {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      margin: 12px 0;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 13px;
      border: 1px solid var(--border);
    }

    .message-content code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 13px;
    }

    .message-content pre code {
      background: transparent;
      padding: 0;
    }

    /* Thinking */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text3);
      font-size: 14px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 6px;
      height: 6px;
      background: var(--text3);
      border-radius: 50%;
      animation: bounce-dot 1.4s infinite ease-in-out;
    }

    .thinking-dots span:nth-child(1) { animation-delay: 0s; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      background: var(--accent);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
      box-shadow: 0 0 60px var(--accent-glow);
    }

    .welcome h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--text2);
      font-size: 15px;
      max-width: 400px;
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .input-container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .input-box {
      display: flex;
      gap: 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px;
      transition: all 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 16px;
      font-size: 15px;
      color: var(--text);
      font-family: var(--font);
      outline: none;
    }

    .input-box input::placeholder { color: var(--text3); }

    .input-box button {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 18px;
    }

    .input-box button:hover {
      background: var(--accent2);
      transform: scale(1.05);
    }

    .input-box button:disabled {
      background: var(--bg4);
      cursor: not-allowed;
      transform: none;
    }

    .input-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text3);
      margin-top: 12px;
    }

    /* Settings modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      animation: fade-in 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 500px;
      max-width: 90vw;
      max-height: 80vh;
      overflow: hidden;
      animation: modal-in 0.3s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--bg3);
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      max-height: 60vh;
    }

    .settings-group {
      margin-bottom: 20px;
    }

    .settings-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 8px;
    }

    .settings-group input,
    .settings-group select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      transition: all 0.2s;
    }

    .settings-group input:focus,
    .settings-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .settings-group select {
      cursor: pointer;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: var(--font);
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent2);
    }

    .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg4);
    }

    /* Status messages */
    .status-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 24px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 300;
    }

    .status-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .status-toast.success {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .status-toast.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--error);
      color: var(--error);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: flex;
      }

      .chat-area {
        margin-left: 0;
      }

      .message-content {
        max-width: 95%;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border2); }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="header-btn sidebar-toggle" onclick="toggleSidebar()">☰</button>
      <div class="logo">RA</div>
      <span class="header-title">RANN Agent</span>
      <span class="header-status" id="header-status">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </span>
    </div>
    <div class="header-right">
      <button class="header-btn" onclick="openSettings()" title="Settings">⚙</button>
      <button class="header-btn" onclick="clearChat()" title="New Chat">✕</button>
    </div>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="clearChat()">
          <span>+</span> New Chat
        </button>
      </div>
      <div class="sidebar-content">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Providers</div>
          <div class="provider-list" id="provider-list"></div>
        </div>
      </div>
    </aside>

    <!-- Chat area -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon">RA</div>
          <h1>RANN Agent</h1>
          <p>Your AI assistant. Type a message to get started.</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-container">
          <div class="input-box">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button id="send-btn" onclick="sendMessage()">↑</button>
          </div>
          <div class="input-hint">RANN Agent can make mistakes. Verify important information.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" onclick="closeSettings()">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>Provider</label>
          <select id="settings-provider" onchange="onProviderChange()">
            <option value="groq">Groq (Free)</option>
            <option value="xkiro">xkiro (Free)</option>
            <option value="deepseek">DeepSeek (Free)</option>
            <option value="gemini">Google Gemini (Free)</option>
            <option value="ollama">Ollama (Local)</option>
            <option value="openai">OpenAI (Paid)</option>
            <option value="anthropic">Anthropic (Paid)</option>
            <option value="custom">Custom Provider</option>
          </select>
        </div>
        <div class="settings-group" id="custom-url-group" style="display:none">
          <label>Base URL</label>
          <input type="text" id="settings-base-url" placeholder="https://api.example.com/v1">
        </div>
        <div class="settings-group">
          <label>Model</label>
          <select id="settings-model"></select>
        </div>
        <div class="settings-group">
          <label>API Key</label>
          <input type="password" id="settings-api-key" placeholder="Enter your API key">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
        <button class="btn btn-primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="status-toast" id="toast"></div>

  <script>
    var API = 'http://127.0.0.1:5555/api';
    var currentProvider = 'groq';
    var chatHistory = [];
    var modelsByProvider = {
      groq: ['llama-3.1-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768', 'gemma-7b-it'],
      xkiro: ['minimax/minimax-m2.7-highspeed:free'],
      deepseek: ['deepseek-chat', 'deepseek-coder'],
      openai: ['gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo', 'gpt-3.5-turbo'],
      anthropic: ['claude-sonnet-4-20250514', 'claude-opus-4-20250514', 'claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022'],
      gemini: ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-1.0-pro'],
      ollama: ['llama3.2', 'llama3.1', 'mistral', 'codellama', 'phi3'],
      custom: []
    };

    // Load providers
    async function loadProviders() {
      try {
        var resp = await fetch(API + '/providers');
        if (resp.ok) {
          var providers = await resp.json();
          var list = document.getElementById('provider-list');
          list.innerHTML = '';
          providers.forEach(function(p) {
            var div = document.createElement('button');
            div.className = 'provider-item ' + p.id;
            if (p.id === currentProvider) div.classList.add('active');
            div.onclick = function() { selectProvider(p.id); };
            div.innerHTML = 
              '<div class="provider-icon">' + (p.name[0] || '?').toUpperCase() + '</div>' +
              '<div class="provider-info">' +
                '<div class="provider-name">' + p.name + '</div>' +
                '<div class="provider-model">' + (p.default_model || '').split('/').pop() + '</div>' +
              '</div>' +
              (p.free ? '<span class="provider-free">FREE</span>' : '');
            list.appendChild(div);
          });
        }
      } catch (e) {
        // Show default providers if API not running
        showDefaultProviders();
      }
    }

    function showDefaultProviders() {
      var list = document.getElementById('provider-list');
      var defaults = [
        { id: 'groq', name: 'Groq', icon: 'G', model: 'llama-3.1-70b', free: true },
        { id: 'xkiro', name: 'xkiro', icon: 'X', model: 'minimax-m2.7', free: true },
        { id: 'deepseek', name: 'DeepSeek', icon: 'D', model: 'deepseek-chat', free: true },
        { id: 'gemini', name: 'Gemini', icon: 'G', model: 'gemini-1.5-flash', free: true },
        { id: 'openai', name: 'OpenAI', icon: 'O', model: 'gpt-4o', free: false },
        { id: 'anthropic', name: 'Anthropic', icon: 'A', model: 'claude-sonnet-4', free: false },
      ];
      list.innerHTML = '';
      defaults.forEach(function(p) {
        var div = document.createElement('button');
        div.className = 'provider-item ' + p.id;
        if (p.id === currentProvider) div.classList.add('active');
        div.onclick = function() { selectProvider(p.id); };
        div.innerHTML = 
          '<div class="provider-icon">' + p.icon + '</div>' +
          '<div class="provider-info">' +
            '<div class="provider-name">' + p.name + '</div>' +
            '<div class="provider-model">' + p.model + '</div>' +
          '</div>' +
          (p.free ? '<span class="provider-free">FREE</span>' : '');
        list.appendChild(div);
      });
    }

    function selectProvider(prov) {
      currentProvider = prov;
      document.querySelectorAll('.provider-item').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelector('.provider-item.' + prov)?.classList.add('active');
      openSettings();
    }

    function openSettings() {
      document.getElementById('settings-modal').classList.add('show');
      document.getElementById('settings-provider').value = currentProvider;
      onProviderChange();
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('show');
    }

    function onProviderChange() {
      var prov = document.getElementById('settings-provider').value;
      var customGroup = document.getElementById('custom-url-group');
      var modelSelect = document.getElementById('settings-model');
      
      if (prov === 'custom') {
        customGroup.style.display = 'block';
        modelSelect.innerHTML = '<option value="">Enter custom model</option>';
      } else {
        customGroup.style.display = 'none';
        var models = modelsByProvider[prov] || [];
        modelSelect.innerHTML = models.map(function(m) {
          return '<option value="' + m + '">' + m.split('/').pop() + '</option>';
        }).join('');
      }
    }

    async function saveSettings() {
      var prov = document.getElementById('settings-provider').value;
      var apiKey = document.getElementById('settings-api-key').value.trim();
      var model = document.getElementById('settings-model').value;
      var baseUrl = document.getElementById('settings-base-url').value.trim();

      if (!apiKey) {
        showToast('Please enter an API key', 'error');
        return;
      }

      var body = { api_key: apiKey };
      if (model) body.model = model;
      if (baseUrl) body.base_url = baseUrl;

      try {
        var resp = await fetch(API + '/key/' + prov, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (resp.ok) {
          currentProvider = prov;
          showToast('Settings saved!', 'success');
          loadProviders();
          closeSettings();
        } else {
          var err = await resp.json();
          showToast(err.error || 'Failed to save', 'error');
        }
      } catch (e) {
        // Save to localStorage as fallback
        localStorage.setItem('rann_provider', prov);
        localStorage.setItem('rann_api_key', apiKey);
        if (model) localStorage.setItem('rann_model', model);
        currentProvider = prov;
        showToast('Saved locally', 'success');
        closeSettings();
      }
    }

    function showToast(msg, type) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'status-toast show ' + type;
      setTimeout(function() {
        toast.classList.remove('show');
      }, 3000);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function clearChat() {
      chatHistory = [];
      var messages = document.getElementById('messages');
      messages.innerHTML = 
        '<div class="welcome">' +
          '<div class="welcome-icon">RA</div>' +
          '<h1>RANN Agent</h1>' +
          '<p>Your AI assistant. Type a message to get started.</p>' +
        '</div>';
      toggleSidebar && toggleSidebar();
    }

    async function sendMessage() {
      var input = document.getElementById('chat-input');
      var msg = input.value.trim();
      if (!msg) return;

      input.value = '';

      // Remove welcome if present
      var welcome = document.querySelector('.welcome');
      if (welcome) welcome.remove();

      addMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });

      addThinking();

      try {
        var resp = await fetch(API + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: currentProvider,
            message: msg,
            history: chatHistory
          })
        });

        removeThinking();

        if (resp.ok) {
          var data = await resp.json();
          if (data.error) {
            addMessage('assistant', 'Error: ' + data.error);
          } else {
            addMessage('assistant', data.content);
            chatHistory.push({ role: 'assistant', content: data.content });
          }
        } else {
          var err = await resp.json();
          addMessage('assistant', 'Error: ' + (err.error || 'Request failed'));
        }
      } catch (e) {
        removeThinking();
        addMessage('assistant', 'Cannot connect to RANN API. Make sure the backend is running:\n\n```\npython3 web_api.py\n```');
      }
    }

    function addMessage(role, content) {
      var messages = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message ' + role;

      // Format
      content = content.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
      content = content.replace(/\n/g, '<br>');

      div.innerHTML = 
        '<div class="message-avatar">' + (role === 'user' ? 'You' : 'RA') + '</div>' +
        '<div class="message-content">' + content + '</div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addThinking() {
      var messages = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'thinking';
      div.innerHTML = 
        '<div class="message-avatar">RA</div>' +
        '<div class="message-content"><div class="thinking"><div class="thinking-dots"><span></span><span></span><span></span></div> Thinking...</div></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeThinking() {
      document.getElementById('thinking')?.remove();
    }

    // Init
    loadProviders();
    onProviderChange();
  </script>
</body>
</html>
