# NOTE: Push this file manually if your token lacks workflow scope.
# Generate PAT with "workflow" scope at: https://github.com/settings/tokens/new
---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python --version
      - run: pip list | head -10
      - run: ruff check .
      - run: black --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . -r requirements.txt -r requirements-dev.txt
      - run: python --version
      - run: pip list | head -10
      - run: pytest tests/ -v --cov=rann_agent --cov-report=xml --cov-fail-under=15 2>&1 | tee pytest.log
      - run: |
          echo "=== PYTEST LOG ===" && cat pytest.log && echo "=== PYTEST LOG END ==="
        if: failure()

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . -r requirements.txt -r requirements-dev.txt
      - run: python --version
      - run: pip list | head -10
      - run: python -m pytest tests/benchmarks/ -v --benchmark-disable-gc 2>&1 | tee benchmark.log
      - run: |
          echo "=== BENCHMARK LOG ===" && cat benchmark.log && echo "=== BENCHMARK LOG END ==="
        if: failure()
      - name: Compare with baseline
        run: |
          python << 'PYEOF'
          import json, os, sys, glob

          base_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          baseline_path = os.path.join(base_dir, "benchmarks", "baseline", "benchmark_baseline.json")
          current_dir = os.path.join(base_dir, ".benchmarks")

          if not os.path.exists(baseline_path):
            print("No baseline found, skipping comparison")
            sys.exit(0)

          current_files = glob.glob(os.path.join(current_dir, "**", "*baseline*.json"), recursive=True)
          if not current_files:
            print("No current benchmarks found, skipping comparison")
            sys.exit(0)

          current_path = current_files[0]

          with open(baseline_path) as f: bdata = json.load(f)
          with open(current_path) as f: cdata = json.load(f)

          regressions = []
          for bn in bdata.get("benchmarks", []):
            for cn in cdata.get("benchmarks", []):
              if bn["name"] == cn["name"]:
                b_med = bn.get("stats", {}).get("median", 0)
                c_med = cn.get("stats", {}).get("median", 0)
                if b_med > 0:
                  pct = abs(c_med - b_med) / b_med * 100
                  if pct > 20:
                    regressions.append(
                      f"REGRESSION: {bn['name']} {pct:.1f}% "
                      f"(baseline={b_med:.2f}ns current={c_med:.2f}ns)"
                    )

          if regressions:
            for r in regressions:
              print(r)
            sys.exit(1)
          print("All benchmarks within 20% of baseline")
          PYEOF
        continue-on-error: true