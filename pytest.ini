[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=rann_agent
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=15

[coverage:run]
source = rann_agent
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False